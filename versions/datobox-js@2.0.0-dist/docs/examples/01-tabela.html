<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabela — Exemplos DataBox</title>
    <meta name="description" content="Colunas personalizadas, pesquisa global, ordenação multi-coluna e paginação com uma única chamada a DataBox.init().">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="../assets/css/examples.css" rel="stylesheet">
</head>
<body data-example="tabela">
<main class="ex-main container" id="ex-main">
    <div class="ex-stage">
        <p class="text-muted small mb-3">Clica num cabeçalho para ordenar. Com Shift+clique acrescentas mais colunas à ordenação.</p>
        <div id="meus-dados"></div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/dataBox.min.js"></script>
<script src="../assets/js/examples.js"></script>
<script id="demo">
const db = DataBox.init({
    target: '#meus-dados',
    data: ExamplesKit.employees(),
    views: {
        card: { active: false },        // os cards vêm ativos por defeito
        table: {
            active: true,
            columns: [
                { data: 'id', title: '#', className: 'text-muted' },
                { data: 'nome', title: 'Nome' },
                { data: 'email', title: 'Email' },
                { data: 'departamento', title: 'Departamento' },
                {
                    data: 'salario',
                    title: 'Salário',
                    render: function (valor, item, tipo) {
                        if (tipo === 'export') return valor;
                        return `<span class="fw-semibold">${valor.toLocaleString('pt-PT')} €</span>`;
                    }
                }
            ]
        }
    },
    search: { active: true, placeholder: 'Pesquisar colaboradores…' },
    sorting: { active: true, multiColumn: true },
    pagination: { limit: 10, limits: [5, 10, 25] }
});
</script>
</body>
</html>
