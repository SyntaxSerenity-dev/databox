<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cards personalizados — Exemplos DataBox</title>
    <meta name="description" content="Cada registo desenhado com o teu próprio template HTML, numa grelha com o número de colunas à escolha.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="../assets/css/examples.css" rel="stylesheet">
</head>
<body data-example="cards">
<main class="ex-main container" id="ex-main">
    <div class="ex-stage">
        <div id="meus-dados"></div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/dataBox.min.js"></script>
<script src="../assets/js/examples.js"></script>
<script id="demo">
const esc = ExamplesKit.esc;   // escapa o HTML dos valores antes de os inserir no template

const db = DataBox.init({
    target: '#meus-dados',
    data: ExamplesKit.employees(),
    views: {
        card: {
            active: true,
            columns: 3,
            itemCssClass: 'col-md-4 mb-3',
            template: function (item, index, instance) {
                return `<div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">${esc(item.nome)}</h5>
                        <p class="card-text text-muted mb-2">${esc(item.cargo)} · ${esc(item.cidade)}</p>
                        <span class="badge bg-primary">${esc(item.departamento)}</span>
                    </div>
                </div>`;
            }
        }
    },
    search: { active: true },
    pagination: { limit: 6, limits: [6, 12, 24] }
});
</script>
</body>
</html>
