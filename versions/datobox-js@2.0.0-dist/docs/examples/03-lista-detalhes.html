<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista com detalhes — Exemplos DataBox</title>
    <meta name="description" content="Lista compacta com template próprio e uma área de detalhes que se expande em cada linha.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="../assets/css/examples.css" rel="stylesheet">
</head>
<body data-example="lista-detalhes">
<main class="ex-main container" id="ex-main">
    <div class="ex-stage">
        <div id="meus-dados"></div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/dataBox.min.js"></script>
<script src="../assets/js/examples.js"></script>
<script id="demo">
const esc = ExamplesKit.esc;

// Conteúdo mostrado quando uma linha é expandida
function detalhes(item, instance) {
    return `<div class="row">
        <div class="col-md-4"><strong>Email:</strong> ${esc(item.email)}</div>
        <div class="col-md-4"><strong>Admissão:</strong> ${esc(item.admissao)}</div>
        <div class="col-md-4"><strong>Salário:</strong> ${item.salario.toLocaleString('pt-PT')} €</div>
    </div>`;
}

const db = DataBox.init({
    target: '#meus-dados',
    data: ExamplesKit.employees(),
    views: {
        card: { active: false },
        table: {
            active: true,
            columns: [
                { data: 'nome', title: 'Nome' },
                { data: 'departamento', title: 'Departamento' }
            ],
            details: detalhes        // a referência indica que os detalhes valem para todas as views
        },
        list: {
            active: true,
            template: function (item) {
                return `<div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>${esc(item.nome)}</strong>
                        <div class="text-muted small">${esc(item.cargo)}</div>
                    </div>
                    <span class="badge bg-primary">${esc(item.departamento)}</span>
                </div>`;
            }
        }
    },
    pagination: { limit: 8, limits: [8, 16, 24] }
});

db.setView('list');   // abre na lista; o alternador permite voltar à tabela
</script>
</body>
</html>
