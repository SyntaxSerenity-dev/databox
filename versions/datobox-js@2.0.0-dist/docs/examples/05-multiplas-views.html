<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Várias views com alternador — Exemplos DataBox</title>
    <meta name="description" content="Ativa as quatro views ao mesmo tempo. O utilizador alterna na interface e o código pode fazer o mesmo com setView().">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="../assets/css/examples.css" rel="stylesheet">
</head>
<body data-example="multiplas-views">
<main class="ex-main container" id="ex-main" data-log>
    <div class="ex-stage">
        <div class="ex-toolbar">
            <span class="text-muted small me-1">Mudar de view por código:</span>
            <button type="button" class="btn btn-sm btn-outline-primary" data-view="table">setView('table')</button>
            <button type="button" class="btn btn-sm btn-outline-primary" data-view="card">setView('card')</button>
            <button type="button" class="btn btn-sm btn-outline-primary" data-view="list">setView('list')</button>
            <button type="button" class="btn btn-sm btn-outline-primary" data-view="kanban">setView('kanban')</button>
        </div>
        <div id="meus-dados"></div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/dataBox.min.js"></script>
<script src="../assets/js/examples.js"></script>
<script id="demo">
const esc = ExamplesKit.esc;

const db = DataBox.init({
    target: '#meus-dados',
    data: ExamplesKit.employees(),
    views: {
        table: { active: true, columns: [{ data: 'nome', title: 'Nome' },
                { data: 'departamento', title: 'Departamento' },
                { data: 'cargo', title: 'Cargo' },
                { data: 'cidade', title: 'Cidade' }] },
        card: {
            active: true,
            columns: 3,
            itemCssClass: 'col-md-4 mb-3',
            template: (item) => `<div class="card h-100"><div class="card-body">
                <h5 class="card-title">${esc(item.nome)}</h5>
                <p class="card-text text-muted mb-0">${esc(item.cargo)}</p></div></div>`
        },
        list: {
            active: true,
            template: (item) => `<strong>${esc(item.nome)}</strong> <span class="text-muted">· ${esc(item.cargo)}</span>`
        },
        kanban: { active: true, groupBy: 'departamento' }
    },
    pagination: { limit: 25, limits: [10, 25] },
    callbacks: {
        onViewChanged: function (viewName, instance) {
            ExamplesKit.log('View ativa: ' + viewName);
        }
    }
});

document.querySelectorAll('[data-view]').forEach(function (botao) {
    botao.addEventListener('click', function () { db.setView(botao.dataset.view); });
});
</script>
</body>
</html>
