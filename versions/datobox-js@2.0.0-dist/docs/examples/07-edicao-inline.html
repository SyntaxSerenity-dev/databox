<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edição inline — Exemplos DataBox</title>
    <meta name="description" content="Duplo clique numa célula para a editar. Cada coluna escolhe o tipo de input e o callback onEdit recebe o valor novo e o antigo.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="../assets/css/examples.css" rel="stylesheet">
</head>
<body data-example="edicao-inline">
<main class="ex-main container" id="ex-main" data-log>
    <div class="ex-stage">
        <p class="text-muted small mb-3">Faz duplo clique numa célula de Nome, Salário, Admissão ou Estado.</p>
        <div id="meus-dados"></div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/dataBox.min.js"></script>
<script src="../assets/js/examples.js"></script>
<script id="demo">
const db = DataBox.init({
    target: '#meus-dados',
    data: ExamplesKit.employees(),
    views: {
        card: { active: false },
        table: {
            active: true,
            inlineEdit: true,
            columns: [
                { data: 'id', title: '#', className: 'text-muted' },
                { data: 'nome', title: 'Nome', editable: true, editType: 'text' },
                { data: 'salario', title: 'Salário (€)', editable: true, editType: 'number' },
                { data: 'admissao', title: 'Admissão', editable: true, editType: 'date' },
                {
                    data: 'estado', title: 'Estado', editable: true, editType: 'select',
                    editOptions: [
                        { value: 'ativo', label: 'Ativo' },
                        { value: 'ferias', label: 'Férias' },
                        { value: 'inativo', label: 'Inativo' }
                    ]
                }
            ]
        }
    },
    pagination: { limit: 10 },
    callbacks: {
        onEdit: function (newValue, oldValue, item, column, instance) {
            // Num projeto real, aqui enviavas a alteração ao servidor
            ExamplesKit.log(`#${item.id} · ${column.data}: ${oldValue} → ${newValue}`);
        }
    }
});
</script>
</body>
</html>
