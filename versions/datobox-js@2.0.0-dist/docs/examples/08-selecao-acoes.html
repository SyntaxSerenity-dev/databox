<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seleção e ações em massa — Exemplos DataBox</title>
    <meta name="description" content="Seleciona vários registos com checkboxes e executa ações sobre o conjunto: alterar estado ou eliminar.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="../assets/css/examples.css" rel="stylesheet">
</head>
<body data-example="selecao-acoes">
<main class="ex-main container" id="ex-main" data-log>
    <div class="ex-stage">
        <div id="meus-dados"></div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/dataBox.min.js"></script>
<script src="../assets/js/examples.js"></script>
<script id="demo">
const db = DataBox.init({
    target: '#meus-dados',
    data: ExamplesKit.employees(),
    views: {
        card: { active: false },
        table: {
            active: true,
            columns: [
                { data: 'nome', title: 'Nome' },
                { data: 'departamento', title: 'Departamento' },
                { data: 'estado', title: 'Estado' }
            ]
        }
    },
    selection: { active: true, mode: 'multi', checkbox: true },
    bulkActions: {
        active: true,
        actions: [
            {
                label: 'Marcar como inativos',
                icon: 'fa-user-slash',
                class: 'btn-warning',
                action: function (items, ids, instance) {
                    ids.forEach(function (id) { instance.updateItem(id, { estado: 'inativo' }); });
                    ExamplesKit.log(ids.length + ' colaborador(es) marcados como inativos');
                }
            },
            {
                label: 'Eliminar',
                icon: 'fa-trash',
                class: 'btn-danger',
                action: function (items, ids, instance) {
                    if (!confirm('Eliminar ' + ids.length + ' registos?')) return;
                    ids.forEach(function (id) { instance.removeItem(id); });
                    ExamplesKit.log(ids.length + ' registo(s) eliminados');
                }
            }
        ]
    },
    pagination: { limit: 10 },
    callbacks: {
        onSelectionChanged: function (ids, items) { ExamplesKit.log('Selecionados: ' + ids.length); }
    }
});
</script>
</body>
</html>
