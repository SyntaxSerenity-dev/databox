<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agrupamento e agregações — Exemplos DataBox</title>
    <meta name="description" content="Linhas agrupadas por departamento, com cabeçalho e rodapé de grupo, e totais calculados no rodapé da tabela.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="../assets/css/examples.css" rel="stylesheet">
</head>
<body data-example="agrupamento-agregacoes">
<main class="ex-main container" id="ex-main">
    <div class="ex-stage">
        <div id="meus-dados"></div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/dataBox.min.js"></script>
<script src="../assets/js/examples.js"></script>
<script id="demo">
const esc = ExamplesKit.esc;

const db = DataBox.init({
    target: '#meus-dados',
    data: ExamplesKit.employees(),
    views: {
        card: { active: false },
        table: {
            active: true,
            footer: true,                       // ativa o rodapé com agregações
            columns: [
                { data: 'nome', title: 'Nome', footer: { type: 'count', prefix: 'Total: ', suffix: ' colaboradores' } },
                { data: 'cargo', title: 'Cargo' },
                { data: 'admissao', title: 'Admissão' },
                {
                    data: 'salario',
                    title: 'Salário',
                    footer: { type: 'sum', prefix: 'Soma: ', suffix: ' €', locale: 'pt-PT' }
                }
            ]
        }
    },
    rowGroup: {
        active: true,
        dataSrc: 'departamento',                // campo pelo qual as linhas são agrupadas
        collapse: true,                         // permite colapsar cada grupo
        startRender: function (groupName, rows, instance) {
            return `<strong>${esc(groupName)}</strong> · ${rows.length} colaboradores`;
        },
        endRender: function (groupName, rows, instance) {
            const media = rows.reduce((soma, r) => soma + r.salario, 0) / rows.length;
            return `<em class="text-muted">Salário médio em ${esc(groupName)}: ${Math.round(media).toLocaleString('pt-PT')} €</em>`;
        }
    },
    pagination: { limit: 25 }
});

db.sort('departamento', 'asc');   // linhas do mesmo grupo ficam juntas
</script>
</body>
</html>
