<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Colunas visíveis, ordem e fixas — Exemplos DataBox</title>
    <meta name="description" content="Mostra e esconde colunas, reordena-as por drag &amp; drop e fixa as extremidades durante o scroll horizontal.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="../assets/css/examples.css" rel="stylesheet">
</head>
<body data-example="colunas">
<main class="ex-main container" id="ex-main">
    <div class="ex-stage">
        <p class="text-muted small mb-3">Usa o menu de colunas para esconder ou mostrar. Arrasta os cabeçalhos para reordenar. A primeira e a última coluna ficam fixas no scroll horizontal.</p>
        <div id="meus-dados"></div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/dataBox.min.js"></script>
<script src="../assets/js/examples.js"></script>
<script id="demo">
const db = DataBox.init({
    target: '#meus-dados',
    data: ExamplesKit.employees(),
    views: {
        card: { active: false },
        table: {
            active: true,
            columnVisibility: true,          // menu para mostrar/esconder colunas
            columnReorder: true,             // drag & drop de cabeçalhos
            fixedColumns: { left: 1, right: 1 },
            columns: [
                { data: 'nome', title: 'Nome', className: 'text-nowrap' },
                { data: 'email', title: 'Email', className: 'text-nowrap' },
                { data: 'departamento', title: 'Departamento', className: 'text-nowrap' },
                { data: 'cargo', title: 'Cargo', className: 'text-nowrap' },
                { data: 'cidade', title: 'Cidade', className: 'text-nowrap', visible: false },   // escondida por defeito
                { data: 'admissao', title: 'Admissão', className: 'text-nowrap' },
                { data: 'salario', title: 'Salário', className: 'text-nowrap' },
                { data: 'estado', title: 'Estado', className: 'text-nowrap' }
            ]
        }
    },
    pagination: { limit: 10 }
});
</script>
</body>
</html>
