<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exportação — Exemplos DataBox</title>
    <meta name="description" content="Copiar, CSV, Excel, PDF e impressão a partir dos dados filtrados, com um render próprio para a exportação.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="../assets/css/examples.css" rel="stylesheet">
</head>
<body data-example="exportacao">
<main class="ex-main container" id="ex-main">
    <div class="ex-stage">
        <div id="meus-dados"></div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/dataBox.min.js"></script>
<script src="../assets/js/examples.js"></script>
<script id="demo">
const db = DataBox.init({
    target: '#meus-dados',
    data: ExamplesKit.employees(),
    views: {
        card: { active: false },
        table: {
            active: true,
            columns: [
                { data: 'nome', title: 'Nome' },
                { data: 'departamento', title: 'Departamento' },
                {
                    data: 'salario',
                    title: 'Salário',
                    render: function (valor, item, tipo) {
                        // "export" recebe texto simples; "display" recebe HTML
                        if (tipo === 'export') return valor + ' EUR';
                        return `<span class="text-success fw-semibold">${valor.toLocaleString('pt-PT')} €</span>`;
                    }
                }
            ]
        }
    },
    search: { active: true },
    export: {
        active: true,
        buttons: ['copy', 'csv', 'excel', 'pdf', 'print'],
        filename: 'colaboradores',
        title: 'Lista de colaboradores',
        orientation: 'landscape',
        pageSize: 'A4'
    },
    pagination: { limit: 10 }
});
</script>
</body>
</html>
