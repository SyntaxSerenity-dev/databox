<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scroll virtual e infinito — Exemplos DataBox</title>
    <meta name="description" content="5 000 registos sem paginação clássica. Compara o modo virtual (recicla o DOM) com o infinito (acrescenta lotes).">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="../assets/css/examples.css" rel="stylesheet">
</head>
<body data-example="scroll-infinito">
<main class="ex-main container" id="ex-main">
    <div class="ex-stage">
        <div class="ex-toolbar">
            <span class="text-muted small me-1">Modo:</span>
            <button type="button" class="btn btn-sm btn-primary" data-modo="virtual">virtual</button>
            <button type="button" class="btn btn-sm btn-outline-primary" data-modo="infinite">infinite</button>
        </div>
        <div id="meus-dados"></div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/dataBox.min.js"></script>
<script src="../assets/js/examples.js"></script>
<script id="demo">
let db = null;

function montar(tipo) {
    if (db) db.destroy();                        // limpa a instância anterior antes de recriar
    db = DataBox.init({
        target: '#meus-dados',
        data: ExamplesKit.generateRows(5000),
        views: {
            card: { active: false },
            table: {
                active: true,
                columns: [
                    { data: 'id', title: '#', className: 'text-muted' },
                    { data: 'nome', title: 'Nome' },
                    { data: 'departamento', title: 'Departamento' },
                    { data: 'cidade', title: 'Cidade' },
                    { data: 'salario', title: 'Salário' }
                ]
            }
        },
        pagination: {
            type: tipo,                          // 'virtual' recicla o DOM; 'infinite' acrescenta lotes
            limit: 50,
            scrollDirection: 'vertical',
            scrollSize: '480px'                  // altura máxima do contentor com scroll
        }
    });
}

document.querySelectorAll('[data-modo]').forEach(function (botao) {
    botao.addEventListener('click', function () {
        document.querySelectorAll('[data-modo]').forEach(function (b) {
            b.className = 'btn btn-sm ' + (b === botao ? 'btn-primary' : 'btn-outline-primary');
        });
        montar(botao.dataset.modo);
    });
});

montar('virtual');
</script>
</body>
</html>
