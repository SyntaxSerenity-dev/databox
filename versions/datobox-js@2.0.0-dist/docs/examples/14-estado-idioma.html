<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estado persistente e idioma — Exemplos DataBox</title>
    <meta name="description" content="A tabela lembra a página, a pesquisa e a ordenação entre visitas, e todos os textos mudam entre pt-PT e en-US.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="../assets/css/examples.css" rel="stylesheet">
</head>
<body data-example="estado-idioma">
<main class="ex-main container" id="ex-main" data-log>
    <div class="ex-stage">
        <div class="ex-toolbar">
            <span class="text-muted small me-1">language:</span>
            <button type="button" class="btn btn-sm btn-primary" data-lang="pt-PT">pt-PT</button>
            <button type="button" class="btn btn-sm btn-outline-primary" data-lang="en-US">en-US</button>
            <button type="button" class="btn btn-sm btn-outline-secondary ms-2" id="limpar-estado">clearState()</button>
        </div>
        <div id="meus-dados"></div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../dist/dataBox.min.js"></script>
<script src="../assets/js/examples.js"></script>
<script id="demo">
let db = null;

function montar(idioma) {
    if (db) db.destroy();
    db = DataBox.init({
        target: '#meus-dados',
        data: ExamplesKit.employees(),
        language: idioma,                         // 'pt-PT' | 'en-US'
        views: {
            card: { active: false },
            table: {
                active: true,
                columns: [
                    { data: 'nome', title: 'Nome' },
                    { data: 'departamento', title: 'Departamento' },
                    { data: 'cidade', title: 'Cidade' },
                    { data: 'salario', title: 'Salário' }
                ]
            }
        },
        search: { active: true },
        export: { active: true, buttons: ['copy', 'csv'] },
        pagination: { limit: 5, limits: [5, 10, 25] },
        stateSave: { active: true, duration: 7200, storage: 'localStorage' },   // lembra página, pesquisa e ordenação por 2 h
        callbacks: {
            onStateSave: function (state, instance) { ExamplesKit.log('Estado guardado'); },
            onStateLoad: function (state, instance) { ExamplesKit.log('Estado restaurado'); }
        }
    });
}

document.querySelectorAll('[data-lang]').forEach(function (botao) {
    botao.addEventListener('click', function () {
        document.querySelectorAll('[data-lang]').forEach(function (b) {
            b.className = 'btn btn-sm ' + (b === botao ? 'btn-primary' : 'btn-outline-primary');
        });
        montar(botao.dataset.lang);
    });
});

document.getElementById('limpar-estado').addEventListener('click', function () {
    db.clearState();
    ExamplesKit.log('Estado apagado — recarrega a página para comprovar');
});

montar('pt-PT');
</script>
</body>
</html>
